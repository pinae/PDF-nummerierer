[project]
name = "pdfnum-backend"
version = "0.1.0"
description = "Django backend of PDF-Nummerierer: stamps serial numbers onto exam PDFs."
readme = "../README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "gunicorn>=26.2,<27",
    "pypdf[crypto]>=6.21.4,<7",
    "reportlab>=5.1,<6",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "pypdfium2>=5.14.0",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-django>=4.14",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pdfnum.settings_test"
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
testpaths = ["."]
norecursedirs = [".venv", "var", "node_modules"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["var", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "RUF001"]
"**/test_*.py" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"**/conftest.py" = ["S101"]
